<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Appointment - SHIUSH Clinics</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #333;
    }

    .appointment-section {
      padding: 60px 20px;
      background: linear-gradient(to bottom, #e6f7ff, #ffffff);
    }

    .appointment-section h2 {
      text-align: center;
      font-size: 2.5rem;
      color: #004080;
      margin-bottom: 20px;
    }

    .appointment-section p {
      text-align: center;
      color: #666;
      max-width: 700px;
      margin: 0 auto 40px;
    }

    form {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.07);
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      background-color: #007bff;
      color: white;
      padding: 14px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #f1f1f1;
      font-size: 0.9em;
      margin-top: 40px;
    }
  </style>
</head>

<body>
<div id="navbar-placeholder"></div>
<script>
  fetch("navbar.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("navbar-placeholder").innerHTML = data;
    });
</script>
  <section class="appointment-section" data-aos="fade-up">
    <h2>Book an Appointment</h2>
    <p>Fill in the form below to request a consultation. You will be contacted shortly to confirm your appointment.</p>

    <form action="success.html" method="POST" name="appointment" data-netlify="true">
      <input type="hidden" name="form-name" value="appointment">
      <input type="text" name="Name" placeholder="Your Name" required />
      <input type="tel" name="Phone" placeholder="Phone Number" required />
      <input type="email" name="Email" placeholder="Email (optional)" />
      <input type="Birth date" name="preffered Date" required />
      <textarea name="Symptoms" placeholder="Brief description of symptoms" required></textarea>
      <button type="submit">Book Appointment</button>
    </form>
  </section>

  <footer>
    © 2025 SHIUSH CLINICS. All rights reserved.
  </footer>

  <!-- AOS Script -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
