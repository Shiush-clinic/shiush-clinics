<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery - SHIUSH Clinics</title>

  <!-- Fonts & AOS -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f4faff;
      color: #333;
    }

    .gallery-header {
      text-align: center;
      padding: 60px 20px 30px;
      background: linear-gradient(to right, #007bff, #00bfff);
      color: white;
    }

    .gallery-header h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .gallery-grid img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #f1f1f1;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<script>
  fetch("navbar.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("navbar-placeholder").innerHTML = data;
    });
</script>

  <header class="gallery-header" data-aos="fade-down">
    <h1>Gallery</h1>
    <p>Take a glimpse into SHIUSH Clinics – where care meets commitment.</p>
  </header>

  <section class="gallery-grid">
    <img src="news 1.jpg" alt="News Article" data-aos="zoom-in"/>
    <img src="news 2.jpg" alt="News Article" data-aos="zoom-in"/>
    <img src="news 3.jpg" alt="News Article" data-aos="zoom-in"/>
    <img src="gallery 1.jpg" alt="Clinic Image 1" data-aos="zoom-in"/>
    <img src="award.jpg" alt="Appreciation" data-aos="zoom-in"/>
    <img src="gallery 2.jpg" alt="Clinic Image 2" data-aos="zoom-in" data-aos-delay="100"/>
    <img src="asthma.jpg" alt="Asthma Awareness" data-aos="zoom-in" data-aos-delay="200"/>
    <img src="diabetes.jpg" alt="Diabetes Awareness" data-aos="zoom-in" data-aos-delay="300"/>
    <img src="my_photo.jpg" alt="Dr. Nitish Shukla" data-aos="zoom-in" data-aos-delay="400"/>
  </section>

  <footer>
    © 2025 SHIUSH CLINICS. All rights reserved.
  </footer>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
